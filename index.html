<title>Wilson & Angelia — Wedding Day Run-down</title>
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --ink:#2b2622; --muted:#6f655c; --line:#e8dfd3;
  --accent:#a8383a; --accent-ink:#ffffff; --ok:#2b7a4b; --ok-bg:#e6f3ea;
  --warn-bg:#fff3d1; --warn-ink:#5f4300; --chip:#f1e9dd; --shadow:0 1px 2px rgba(60,40,20,.08);
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171412; --surface:#221e1b; --ink:#f3ece4; --muted:#b2a69a; --line:#38322c;
    --accent:#e57a76; --accent-ink:#1a1210; --ok:#6fcb92; --ok-bg:#1e3326;
    --warn-bg:#3b2f10; --warn-ink:#f3d98f; --chip:#2e2824; --shadow:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171412; --surface:#221e1b; --ink:#f3ece4; --muted:#b2a69a; --line:#38322c;
  --accent:#e57a76; --accent-ink:#1a1210; --ok:#6fcb92; --ok-bg:#1e3326;
  --warn-bg:#3b2f10; --warn-ink:#f3d98f; --chip:#2e2824; --shadow:none;
  color-scheme: dark;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
#app{ max-width:560px; margin:0 auto; padding:16px 14px 90px; }
h1,h2,h3{ margin:0; line-height:1.2; }
a{ color:inherit; }
.serif{ font-family: Georgia, "Times New Roman", serif; }
.hero{ padding:18px 4px 6px; }
.hero h1{ font-size:30px; letter-spacing:-.3px; }
.hero p{ margin:6px 0 0; color:var(--muted); }
.group{ margin-top:22px; }
.group h2{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 4px 8px; font-weight:700; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.person-btn{
  display:flex; flex-direction:column; gap:4px; text-decoration:none;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
  min-height:76px; box-shadow:var(--shadow);
}
.person-btn:active{ transform:scale(.98); }
.person-btn b{ font-size:18px; }
.person-btn small{ color:var(--muted); font-size:13px; }
.mini-bar{ height:5px; background:var(--chip); border-radius:3px; overflow:hidden; margin-top:4px; }
.mini-bar i{ display:block; height:100%; background:var(--ok); width:0; }
.links{ display:flex; gap:10px; margin-top:26px; }
.links a{ flex:1; text-align:center; padding:14px 10px; border:1px solid var(--line); border-radius:12px; text-decoration:none; background:var(--surface); font-weight:600; }
.tip{ margin-top:22px; background:var(--chip); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--muted); }
.tip b{ color:var(--ink); }
.topbar{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.back{ text-decoration:none; font-weight:600; padding:8px 12px 8px 4px; color:var(--accent); }
.head{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); }
.head h1{ font-size:28px; }
.role{ color:var(--muted); margin-top:2px; }
.progress{ margin-top:14px; }
.progress .row{ display:flex; justify-content:space-between; font-weight:600; font-size:15px; }
.bar{ height:10px; background:var(--chip); border-radius:6px; overflow:hidden; margin-top:6px; }
.bar i{ display:block; height:100%; background:var(--ok); width:0; transition:width .25s; }
.actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.btn{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:12px; padding:12px 14px; font:inherit; font-weight:600; min-height:46px; cursor:pointer;
}
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); flex:1; }
.btn.ghost{ background:transparent; }
.banner{ margin-top:12px; background:var(--warn-bg); color:var(--warn-ink); border-radius:12px; padding:10px 12px; font-size:14px; }
.carbox{ margin-top:12px; background:var(--chip); border-radius:12px; padding:10px 12px; font-size:14px; }
.phase{ margin:24px 4px 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; }
.task{
  display:flex; gap:12px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; box-shadow:var(--shadow);
}
.task.next{ border:2px solid var(--accent); padding:11px; }
.task.done{ background:var(--ok-bg); border-color:transparent; }
.task.done h3, .task.done ul, .task.done .bring, .task.done .with{ opacity:.6; }
.task.done h3{ text-decoration:line-through; text-decoration-thickness:1px; }
.check{
  flex:0 0 auto; width:48px; height:48px; border-radius:14px; border:2.5px solid var(--muted);
  background:transparent; color:transparent; font-size:26px; line-height:1; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center; font-weight:700;
}
.task.done .check{ background:var(--ok); border-color:var(--ok); color:#fff; }
.body{ flex:1; min-width:0; }
.meta{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:14px; }
.time{ background:var(--accent); color:var(--accent-ink); padding:2px 9px; border-radius:99px; font-weight:700; }
.task.done .time{ background:var(--muted); }
.place{ color:var(--muted); }
.badge{ font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
.body h3{ font-size:18px; margin:6px 0 4px; }
.body ul{ margin:4px 0 0; padding-left:20px; }
.body li{ margin:3px 0; }
.bring, .with, .flag, .donetime{ margin-top:8px; font-size:14px; }
.bring{ background:var(--chip); border-radius:10px; padding:7px 10px; }
.with{ color:var(--muted); }
.flag{ background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:7px 10px; }
.donetime{ color:var(--ok); font-weight:600; }
.body li.imp{ list-style:none; margin-left:-20px; background:var(--warn-bg); color:var(--warn-ink); border-radius:8px; padding:5px 9px; font-weight:600; }
.task.upd{ border:2px solid #d32f2f; padding:11px; }
.updbadge{ background:#d32f2f; color:#fff; font-size:12px; font-weight:700; letter-spacing:.06em; padding:2px 8px; border-radius:99px; }
.body li.upd{ list-style:none; margin-left:-20px; background:#ffd6d6; color:#b00020; font-weight:700; border-radius:8px; padding:5px 9px; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .body li.upd{ background:#4a1d1d; color:#ff9a9a; } }
:root[data-theme="dark"] .body li.upd{ background:#4a1d1d; color:#ff9a9a; }
.footer-actions{ margin-top:26px; display:flex; flex-direction:column; gap:10px; }
.empty{ text-align:center; color:var(--muted); padding:30px 10px; }
.tl{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
.tl .meta{ margin-bottom:4px; }
.tl h3{ font-size:17px; margin-bottom:6px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ background:var(--chip); border-radius:99px; padding:3px 10px; font-size:13px; text-decoration:none; }
.contact{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
.contact small{ display:block; color:var(--muted); }
.call{ text-decoration:none; background:var(--ok); color:#fff; padding:10px 14px; border-radius:10px; font-weight:700; white-space:nowrap; }
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet{ background:var(--bg); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom, 0px)); max-height:88vh; overflow:auto; }
.sheet h2{ font-size:20px; margin-bottom:4px; }
.sheet p{ margin:0 0 10px; color:var(--muted); font-size:14px; }
.sheet textarea{ width:100%; min-height:200px; border:1px solid var(--line); border-radius:12px; padding:10px; font:14px/1.4 ui-monospace, Menlo, monospace; background:var(--surface); color:var(--ink); }
.sheet .actions .btn{ flex:1; text-align:center; text-decoration:none; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; z-index:60; }
</style>
</head>

function groupOf(key){ var p=PEOPLE[key]; return p.bm?"BM":(p.gm?"GM":null); }
function expand(who){
  var out=[];
  who.forEach(function(w){
    if(w==="BM") BM.forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
    else if(w==="GM") GM.forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
    else if(out.indexOf(w)<0) out.push(w);
  });
  return out;
}
EV.forEach(function(e,i){ e._i=i; e.people=expand(e.who); });
var SORTED = EV.slice().sort(function(a,b){ return a.t-b.t || a._i-b._i; });

function resolve(key){
  var g=groupOf(key), list=[];
  SORTED.forEach(function(e){
    if(e.people.indexOf(key)<0) return;
    var per=e.per||{}, base=(g&&per[g])||{}, me=per[key]||{};
    var steps=(me.s||base.s||e.s||[]).slice();
    steps=steps.concat(base.a||[], me.a||[]);
    var bring=(me.b||base.b||e.b||[]).slice();
    var others=e.people.filter(function(x){ return x!==key; });
    list.push({
      id:e.id, t:e.t, upd:!!e.upd, label:e.label, place:e.place, ph:e.ph,
      title:me.title||base.title||e.title,
      steps:steps, bring:bring,
      flag:me.flag||base.flag||"",
      others:others
    });
  });
  return list;
}

var KEY="wedding-day-runner-v1", mem={}, storageOK=true;
var inApp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(navigator.userAgent)||(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!/Safari/.test(navigator.userAgent));
function readStore(){
  var srcs=[];
  try{ srcs.push(window.localStorage.getItem(KEY)); }catch(e){ storageOK=false; }
  try{ srcs.push(window.sessionStorage.getItem(KEY)); }catch(e){}
  try{ if(window.name&&window.name.indexOf("wdr:")===0) srcs.push(window.name.slice(4)); }catch(e){}
  var out={};
  srcs.forEach(function(r){
    if(!r) return;
    try{ var o=JSON.parse(r); Object.keys(o).forEach(function(k){ out[k]=out[k]||{}; Object.keys(o[k]).forEach(function(id){ out[k][id]=Math.max(out[k][id]||0,o[k][id]); }); }); }catch(e){}
  });
  return out;
}
function loadState(){
  mem=readStore();
  try{ window.localStorage.setItem(KEY+"-test","1"); window.localStorage.removeItem(KEY+"-test"); }catch(e){ storageOK=false; }
}
function saveState(){
  var s=JSON.stringify(mem);
  try{ window.localStorage.setItem(KEY,s); }catch(e){ storageOK=false; }
  try{ window.sessionStorage.setItem(KEY,s); }catch(e){}
  try{ if(!window.name||window.name.indexOf("wdr:")===0) window.name="wdr:"+s; }catch(e){}
}
function doneAt(key,id){ return mem[key]&&mem[key][id]||0; }
function toggle(key,id){
  mem[key]=mem[key]||{};
  if(mem[key][id]) delete mem[key][id]; else mem[key][id]=Date.now();
  saveState();
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function clock(ms){ try{ return new Date(ms).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
function counts(key){
  var tasks=resolve(key), d=0;
  tasks.forEach(function(t){ if(doneAt(key,t.id)) d++; });
  return {done:d,total:tasks.length};
}

function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); },2200);
}

      h+='<a class="person-btn" href="#'+k+'"><b>'+esc(PEOPLE[k].name)+'</b><small>'+esc(PEOPLE[k].role)+'</small>'
        +'<small>'+c.done+' of '+c.total+' done</small><div class="mini-bar"><i style="width:'+pct+'%"></i></div></a>';
    });
    h+='</div></div>';
  });
  h+='<div class="links"><a href="#timeline">Full timeline</a><a href="#contacts">Cars</a></div>';
  h+='<div class="tip"><b>How ticking works:</b> your ticks are saved on this phone, so closing the page won’t lose them. Only you can see your own ticks.</div>';
  app.innerHTML=h;
}

function taskHTML(key,t,nextId){
  var d=doneAt(key,t.id), cls="task"+(d?" done":"")+(!d&&t.id===nextId?" next":"")+(t.upd?" upd":"");
  var h='<article class="'+cls+'" id="t-'+t.id+'">'
    +'<button class="check" data-id="'+t.id+'" aria-pressed="'+(d?"true":"false")+'" aria-label="'+(d?"Undo: ":"Mark done: ")+esc(t.title)+'">✓</button>'
    +'<div class="body"><div class="meta"><span class="time">'+esc(t.label)+'</span><span class="place">📍 '+esc(t.place)+'</span>'
    +(!d&&t.id===nextId?'<span class="badge">Next up</span>':'')+(t.upd?'<span class="updbadge">UPDATED</span>':'')+'</div>'
    +'<h3>'+(/must/i.test(t.title)?'⚠️ ':'')+esc(t.title)+'</h3>';
  if(t.steps.length){ h+='<ul>'+t.steps.map(function(s){ var imp=false,upd=false; while(s.charAt(0)==="!"||s.charAt(0)==="~"){ if(s.charAt(0)==="!") imp=true; else upd=true; s=s.slice(1); } imp=imp||/make sure|must|ensure/i.test(s); return upd?'<li class="upd">🔴 '+esc(s)+'</li>':(imp?'<li class="imp">⚠️ '+esc(s)+'</li>':'<li>'+esc(s)+'</li>'); }).join("")+'</ul>'; }
  if(t.bring.length){ h+='<div class="bring">🎒 <b>Bring:</b> '+t.bring.map(esc).join(" · ")+'</div>'; }
  if(t.others.length&&t.others.length<=5){ h+='<div class="with">👥 With: '+t.others.map(function(o){ return esc(PEOPLE[o].name); }).join(", ")+'</div>'; }
  if(t.flag){ h+='<div class="flag">⚠️ '+esc(t.flag)+'</div>'; }
  if(d){ h+='<div class="donetime">✓ Done at '+esc(clock(d))+'</div>'; }
  return h+'</div></article>';
}

function person(key){
  var p=PEOPLE[key];
  var h='<div class="topbar"><a class="back" href="#">‹ Everyone</a></div>';
  h+='<div class="head"><h1 class="serif">'+esc(p.name)+'</h1><div class="role">'+esc(p.role)+'</div>'
    +'<div class="progress"><div class="row"><span id="pcount"></span><span id="ppct"></span></div><div class="bar"><i id="pbar"></i></div></div>'
    +'<div class="actions"><button class="btn" id="hide"></button></div>';
  if(inApp){ h+='<div class="banner">⚠️ You’re in an in-app browser (like WhatsApp), which often forgets your ticks. For them to stay saved, tap the <b>⋯ menu</b> and choose <b>Open in Safari / Chrome</b>, then tick there.</div>'; }
  else if(!storageOK){ h+='<div class="banner">⚠️ This browser can’t save ticks after you close the page. For them to stay saved, open the link in Safari or Chrome.</div>'; }
  if(p.car&&CARS[p.car]){
    var c=CARS[p.car];
    h+='<div class="carbox">🚗 <b>'+esc(c.title)+'</b><br>'+c.members.map(function(m){ return esc(PEOPLE[m].name); }).join(", ")+'<br><span style="color:var(--muted)">'+esc(c.note)+'</span></div>';
  }
  h+='</div><div id="tasks"></div>';
  h+='<div class="footer-actions"><a class="btn" style="text-align:center;text-decoration:none" href="#contacts">🚗 Cars</a><a class="btn" style="text-align:center;text-decoration:none" href="#timeline">🕒 Full timeline</a><button class="btn ghost" id="reset">Reset my ticks</button></div>';
  app.innerHTML=h;
  renderTasks(key,true);

  document.getElementById("tasks").addEventListener("click",function(ev){
    var b=ev.target.closest(".check"); if(!b) return;
    toggle(key,b.getAttribute("data-id")); renderTasks(key,false);
  });
  document.getElementById("hide").addEventListener("click",function(){ hideDone=!hideDone; renderTasks(key,false); });
  var rb=document.getElementById("reset"), armed=false, timer;
  rb.addEventListener("click",function(){
    if(!armed){ armed=true; rb.textContent="Tap again to clear all my ticks"; timer=setTimeout(function(){ armed=false; rb.textContent="Reset my ticks"; },3500); }
    else{ clearTimeout(timer); delete mem[key]; saveState(); armed=false; rb.textContent="Reset my ticks"; renderTasks(key,false); toast("Ticks cleared"); }
  });
}

function renderTasks(key,first){
  var tasks=resolve(key), done=0, nextId=null;
  tasks.forEach(function(t){ if(doneAt(key,t.id)) done++; else if(!nextId) nextId=t.id; });
  var pct=tasks.length?Math.round(done/tasks.length*100):0;
  document.getElementById("pcount").textContent=done+" of "+tasks.length+" done";
  document.getElementById("ppct").textContent=pct+"%";
  document.getElementById("pbar").style.width=pct+"%";
  document.getElementById("hide").textContent=hideDone?"Show done":"Hide done";
  var y=window.scrollY, h="", lastPh=null, shown=0;
  tasks.forEach(function(t){
    if(hideDone&&doneAt(key,t.id)) return;
    if(t.ph!==lastPh){ h+='<div class="phase">'+esc(PH[t.ph])+'</div>'; lastPh=t.ph; }
    h+=taskHTML(key,t,nextId); shown++;
  });
  if(!shown){ h='<div class="empty">'+(tasks.length?'🎉 All done — well done, '+esc(PEOPLE[key].name)+'!':'No tasks listed for you.')+'</div>'; }
  document.getElementById("tasks").innerHTML=h;
  if(first&&done>0&&nextId){
    var el=document.getElementById("t-"+nextId);
    if(el&&el.scrollIntoView){ try{ el.scrollIntoView({block:"center"}); }catch(e){} }
  } else { window.scrollTo(0,y); }
}

function timeline(){
  var h='<div class="topbar"><a class="back" href="#">‹ Everyone</a></div><div class="hero" style="padding-top:0"><h1 class="serif">Full timeline</h1><p>Everything in order, with who is involved. Tap a name for their page.</p></div>';
  var lastPh=null;
  SORTED.forEach(function(e){
    if(e.ph!==lastPh){ h+='<div class="phase">'+esc(PH[e.ph])+'</div>'; lastPh=e.ph; }
    h+='<div class="tl"><div class="meta"><span class="time">'+esc(e.label)+'</span><span class="place">📍 '+esc(e.place)+'</span></div><h3>'+esc(e.title)+'</h3><div class="chips">'
      +e.people.map(function(k){ return '<a class="chip" href="#'+k+'">'+esc(PEOPLE[k].name)+'</a>'; }).join("")+'</div></div>';
  });
  app.innerHTML=h;
}

function contacts(){
  var h='<div class="topbar"><a class="back" href="#">‹ Everyone</a></div><div class="hero" style="padding-top:0"><h1 class="serif">Cars</h1><p>Who is riding in which car.</p></div>';
  h+='<div class="group">';
  [1,2,3,4].forEach(function(n){
    var c=CARS[n];
    h+='<div class="tl"><h3>'+esc(c.title)+'</h3><div class="chips">'+c.members.map(function(m){ return '<a class="chip" href="#'+m+'">'+esc(PEOPLE[m].name)+'</a>'; }).join("")+'</div><div style="color:var(--muted);font-size:14px;margin-top:6px">'+esc(c.note)+'</div></div>';
  });
  h+='</div>';
  app.innerHTML=h;
}

function route(){
  var raw=decodeURIComponent((location.hash||"").slice(1)), key=null;
  Object.keys(PEOPLE).forEach(function(k){ if(k.toLowerCase()===raw.toLowerCase()) key=k; });
  if(key) person(key);
  else if(raw==="timeline"){ timeline(); window.scrollTo(0,0); }
  else if(raw==="contacts"){ contacts(); window.scrollTo(0,0); }
  else { home(); window.scrollTo(0,0); }
}
loadState();
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest("a[href^='#']");
  if(!a) return;
  e.preventDefault();
  var h=a.getAttribute("href");
  var url=(h==="#")?(location.pathname+location.search):h;
  try{ history.pushState(null,"",url); }catch(err){ try{ location.hash=h; }catch(e2){} }
  try{ route(); }catch(e3){ app.innerHTML='<p style="padding:20px">Sorry — something went wrong. Please open the link in Safari or Chrome.</p>'; }
});
window.addEventListener("hashchange",route);
window.addEventListener("popstate",route);
try{ route(); }catch(err){ app.innerHTML='<p style="padding:20px">Sorry — something went wrong loading this page. Please open the link in Safari or Chrome.</p>'; }
})();
</script>
</body>
</html>
